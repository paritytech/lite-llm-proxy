model_list:
  # ---- Kimi / Moonshot (platform.kimi.ai, base api.moonshot.ai/v1) ----
  # General-purpose default. Teammates send "model": "kimi-k2".
  - model_name: kimi-k2
    litellm_params:
      model: moonshot/kimi-k2.6
      api_key: os.environ/MOONSHOT_API_KEY
      api_base: os.environ/MOONSHOT_API_BASE
  # Cheaper / cost-sensitive workflows.
  - model_name: kimi-k2.5
    litellm_params:
      model: moonshot/kimi-k2.5
      api_key: os.environ/MOONSHOT_API_KEY
      api_base: os.environ/MOONSHOT_API_BASE
  # Strongest coding model (thinking always on). Moonshot does NOT return per-call cost,
  # so Kimi spend is price-map-only — and this model is too new for the map (tracks $0).
  # Hence the explicit pin (platform.kimi.ai: $0.95 / 1M in, $0.19 / 1M cache hit,
  # $4.00 / 1M out). The cache-hit pin matters: Moonshot auto-caches context, and without
  # it every cached token is metered at the full input price (~5x overcount on agentic
  # workloads). Remove once LiteLLM's cost map includes it.
  - model_name: kimi-k2.7-code
    litellm_params:
      model: moonshot/kimi-k2.7-code
      api_key: os.environ/MOONSHOT_API_KEY
      api_base: os.environ/MOONSHOT_API_BASE
      input_cost_per_token: 0.00000095
      output_cost_per_token: 0.000004
      cache_read_input_token_cost: 0.00000019
  # Flagship reasoning model (1M context, vision). Same deal: no per-call cost from
  # Moonshot and too new for the price map, so prices are pinned explicitly
  # (platform.kimi.ai/docs/pricing/chat-k3: $3.00 / 1M in, $0.30 / 1M cache hit,
  # $15.00 / 1M out). Remove the pins once the map includes moonshot/kimi-k3.
  - model_name: kimi-k3
    litellm_params:
      model: moonshot/kimi-k3
      api_key: os.environ/MOONSHOT_API_KEY
      api_base: os.environ/MOONSHOT_API_BASE
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      cache_read_input_token_cost: 0.0000003

  # ---- OpenRouter (base openrouter.ai/api/v1) ----
  # OpenRouter returns the actual per-call cost and LiteLLM records it directly —
  # including on STREAMED responses since v1.94.0 (upstream fix PR #32255 for
  # BerriAI/litellm#16021; on <= v1.93 streamed calls fell back to the price map and
  # map-missing models metered $0, which is why these aliases carried temporary
  # list-price pins until 2026-08-12). Spot-check PASSED on this deployment
  # 2026-08-12: a streamed wildcard call to a map-missing model recorded spend equal
  # to OpenRouter's reported cost, so the pins came off. Do NOT re-add price pins to
  # OpenRouter models — a pin OVERRIDES the real per-call cost. Pins belong only on
  # providers that return no cost (Kimi above) or as the explicit $0 pin on the
  # self-hosted deepseek-flash pod entries (below). The price map is auto-fetched from
  # GitHub at startup and refreshed by the nightly cron (POST /reload/model_cost_map);
  # for OpenRouter it only matters as a fallback, never the primary source.
  - model_name: claude-sonnet
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4.6
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: claude-opus
    litellm_params:
      model: openrouter/anthropic/claude-opus-4.8
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: gpt-5
    litellm_params:
      model: openrouter/openai/gpt-5.5
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: gpt-5-mini
    litellm_params:
      model: openrouter/openai/gpt-5.4-mini
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: gemini-pro
    litellm_params:
      model: openrouter/google/gemini-2.5-pro
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: gemini-flash
    litellm_params:
      model: openrouter/google/gemini-3.5-flash
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: deepseek
    litellm_params:
      model: openrouter/deepseek/deepseek-v3.2
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: deepseek-r1
    litellm_params:
      model: openrouter/deepseek/deepseek-r1
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: deepseek-v4-pro
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: minimax-m3
    litellm_params:
      model: openrouter/minimax/minimax-m3
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: llama-4-maverick
    litellm_params:
      model: openrouter/meta-llama/llama-4-maverick
      api_key: os.environ/OPENROUTER_API_KEY

  # Wildcard catch-all: any other OpenRouter model by its full ID, e.g.
  #   "model": "openrouter/qwen/qwen3-max".
  - model_name: openrouter/*
    litellm_params:
      model: openrouter/*
      api_key: os.environ/OPENROUTER_API_KEY

  # ---- Self-hosted vLLM (Runpod GPU pod, via reverse SSH tunnel) ----
  # DeepSeek-V4-Flash served by our own vLLM pod (github.com/paritytech/vllm-parity).
  # The pod has no stable public address (new IP every relaunch), so it dials INTO
  # this box over SSH (restricted "vllm-tunnel" account) and binds
  # 172.17.0.1:18000 -> its local vLLM :9001. host.docker.internal below resolves to
  # that same 172.17.0.1 (extra_hosts in docker-compose.yml), so pod restarts need no
  # change here — the pod just re-dials. Topology + box setup + rollout: RUNBOOK § I.
  # Prompts sent to this alias never leave Parity infrastructure (unless the
  # OpenRouter fallback below fires — see litellm_settings).
  # Cost pin: an EXPLICIT $0 (since 2026-09-04). Pod tokens are free to the team — the
  # GPU is already paid for — so pod-served calls must not drain anyone's key budget.
  # (Until then a throttle pin at OpenRouter's rate, $0.15/1M in / $0.40/1M out, made
  # "free" tokens eat quotas, which in practice just meant refreshing budgets by hand.)
  # Why pin 0 instead of deleting the pin: with NO pin LiteLLM looks the served model up
  # in the price map, which has no hosted_vllm entry for it — cost calculation then
  # fails, and a failed cost calc means NO spend-log row at all (the request vanishes
  # from /ui Logs and the corpus export). A literal 0 is honored (verified in the v1.97.0
  # source): the router registers the pin under the deployment id whenever it is
  # `not None`, use_custom_pricing_for_model (also `is not None`) steers cost calc to
  # that entry, the cost calculator treats an explicit 0/0 as "no token pricing" and
  # returns $0 without consulting the map or any cache-token price, and the spend-log
  # row is written for any non-None cost — so pod calls still land in the logs, at $0.
  # Two consequences to keep in mind:
  #   1. Key budgets no longer throttle pod traffic at all — the per-entry
  #      max_parallel_requests caps below and per-key rpm limits are the only brakes.
  #   2. LiteLLM SKIPS the budget check entirely for a model group whose deployments are
  #      all explicitly $0 (user_api_key_auth `_is_model_cost_zero`), so a key that is
  #      already over budget can still call these three aliases. Fine for the pod-ONLY
  #      aliases; for deepseek-flash it means an over-budget key still reaches the
  #      OpenRouter fallback while the pod is down, and that fallback bills real spend
  #      (bounded only by per-key rpm and the OpenRouter credit limit).
  # The fallback itself is NOT made free: cost is computed from the deployment that
  # actually answered, and the wildcard entry it lands on is pin-free.
  - model_name: deepseek-flash
    litellm_params:
      # Served model name: `curl 127.0.0.1:9001/v1/models` on the pod. Keep the
      # hosted_vllm/ prefix — it routes via LiteLLM's OpenAI-compatible vLLM provider.
      model: hosted_vllm/deepseek-v4-flash-0731
      api_base: http://host.docker.internal:18000/v1
      api_key: os.environ/VLLM_API_KEY
      input_cost_per_token: 0
      output_cost_per_token: 0
      # Pod benchmark (1x B300, 2026-08-08): throughput holds up to ~32 parallel
      # requests. Cap below that knee; excess spills to the fallback instead of
      # queueing on a saturated GPU. NOTE: caps are PER ENTRY — the pod's real
      # ceiling is this cap PLUS both pod-ONLY entries' below (20 + 8 + 4 = 32).
      # The versioned twin's 4 slots came out of THIS entry's former 24: over-cap
      # traffic here spills gracefully to OpenRouter, while over-cap parity
      # traffic hard-429s — so the squeeze belongs on the alias that degrades soft.
      max_parallel_requests: 20

  # Routing variants of the same model (added 2026-08-12, versioned alias 2026-08-17).
  # Same served model, same backend — only WHERE the request is allowed to run (and
  # whether the version is pinned in the name) differs:
  #   deepseek-flash                 pod first, OpenRouter fallback (above)
  #   deepseek-flash-parity          pod ONLY — no fallback, hard in-infra guarantee
  #   deepseek-flash-parity-v4-0731  pod ONLY, version-explicit twin of the above
  #   deepseek-flash-openrouter      OpenRouter ONLY — never touches the pod
  #
  # Pod ONLY: deliberately NO entry in litellm_settings.fallbacks, so a dead
  # pod/tunnel is a fast error, never a silent OpenRouter hop. This is the hard
  # "prompts never leave Parity infra" alias (plain deepseek-flash's guarantee is
  # soft — its fallback ships the prompt to OpenRouter), and the one to use when
  # testing the pod, where a transparent fallback would mask an outage. Over its
  # parallel cap it 429s instead of spilling — intended. Keep litellm_params in
  # lockstep across ALL THREE hosted_vllm entries (served model name, api_base,
  # cost pin); only the caps and fallback behavior differ.
  - model_name: deepseek-flash-parity
    litellm_params:
      model: hosted_vllm/deepseek-v4-flash-0731
      api_base: http://host.docker.internal:18000/v1
      api_key: os.environ/VLLM_API_KEY
      input_cost_per_token: 0
      output_cost_per_token: 0
      # Unchanged at 8 since launch — the versioned twin's slots were carved out of
      # deepseek-flash's cap instead, so existing users of THIS alias keep their
      # capacity (see deepseek-flash's cap note for the 20 + 8 + 4 = 32 arithmetic).
      max_parallel_requests: 8

  # Version-EXPLICIT twin of deepseek-flash-parity: identical routing contract
  # (pod ONLY, no fallback), but the name pins exactly which model the pod serves,
  # for users who want to know what they're getting rather than trust a floating
  # alias. MAINTENANCE RULE: this name hard-codes the pod's model version — whenever
  # the pod is redeployed with a new model, add a new alias matching the new served
  # model's version (keeping this one only while the old model is still served) and
  # update the model tables in README.md and the alias lists in AGENTS.md /
  # CLAUDE.md in the same PR.
  - model_name: deepseek-flash-parity-v4-0731
    litellm_params:
      model: hosted_vllm/deepseek-v4-flash-0731
      api_base: http://host.docker.internal:18000/v1
      api_key: os.environ/VLLM_API_KEY
      input_cost_per_token: 0
      output_cost_per_token: 0
      max_parallel_requests: 4

  # OpenRouter ONLY: a curated name for what the openrouter/* wildcard already
  # serves — same full ID as deepseek-flash's fallback target, useful for comparing
  # pod vs cloud behavior or deliberately bypassing the pod. Real per-call cost is
  # recorded; no price pin (see the OpenRouter section note above).
  - model_name: deepseek-flash-openrouter
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash-0731
      api_key: os.environ/OPENROUTER_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Models are defined here in config, not stored in the DB.
  store_model_in_db: false

  # ---- Request logging (training corpus) ----
  # Store full prompts + responses in the LiteLLM_SpendLogs table (Postgres), viewable
  # per-request in the /ui Logs page. Purpose: build a corpus for model training.
  # Teammates are informed (README "Logging & privacy") and can opt out per request by
  # sending "no-log": true in the body.
  store_prompts_in_spend_logs: true
  # Auto-delete spend-log rows older than 90 days, checked once a day. This bounds
  # Postgres growth only — nothing is lost: the durable corpus is the nightly JSONL
  # export (scripts/export-logs.sh), which runs long before rows age out. To keep
  # more/less in the hot store (UI browsing window), edit the period here and
  # force-recreate litellm.
  maximum_spend_logs_retention_period: "90d"
  maximum_spend_logs_retention_interval: "1d"

  # ---- Open WebUI per-user attribution (chat UI, llm.substrate.dev:8443) ----
  # The hosted chat UI (docker-compose.yml `openwebui`) calls this proxy with ONE
  # shared budget-capped key, so key-level spend can't tell its users apart. Open
  # WebUI stamps every request with the signed-in user (X-OpenWebUI-User-* headers,
  # ENABLE_FORWARD_USER_INFO_HEADERS) — map the email onto LiteLLM's end-user
  # ("customer") field so per-person usage shows in /ui → Usage → Customer. Email
  # over user-id: it's the stable, human-readable identifier (display names are
  # user-editable). Known upstream flake: BerriAI/litellm#14667 reports this mapping
  # not firing on some versions — the spend TAGS in litellm_settings below are the
  # reliable fallback; verify both at rollout (RUNBOOK § J step 4).
  user_header_mappings:
    - header_name: X-OpenWebUI-User-Email
      litellm_user_role: customer

litellm_settings:
  # Silently drop unsupported OpenAI params instead of erroring (eases tool compatibility).
  drop_params: true
  # Self-hosted resilience: if the vLLM pod is unreachable (pod stopped, tunnel down)
  # or over its parallel cap, retry the SAME model on OpenRouter (served via the
  # openrouter/* wildcard above) — users get a slower, paid answer instead of an
  # error, and pod restarts stay invisible. Note: fallback traffic DOES leave our
  # infra (normal OpenRouter path). Verify both directions in RUNBOOK § I step 5.
  # deepseek-flash-parity AND deepseek-flash-parity-v4-0731 have deliberately NO
  # entries here — their whole contract is fail-fast, in-infra only (see their
  # model_list comments).
  fallbacks:
    - deepseek-flash: ["openrouter/deepseek/deepseek-v4-flash-0731"]

  # Copy Open WebUI's user headers onto each request's spend tags — belt-and-braces
  # per-user attribution on the chat UI's shared key, independent of the
  # user_header_mappings in general_settings (see the comment there). Visible in
  # /ui → Logs, i.e. the attributed 90-day hot store ONLY: the nightly corpus
  # export DELIBERATELY drops request_tags (identity-column whitelist in
  # scripts/export-logs.sh) — do NOT "fix" the export to include them; that would
  # leak user identities into the forever-corpus. Harmless on non-chat traffic:
  # absent headers add no tags. And informational only: any API keyholder can set
  # these headers on their own calls.
  extra_spend_tag_headers:
    - "x-openwebui-user-email"
    - "x-openwebui-user-id"
