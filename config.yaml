model_list:
  # ---- Kimi / Moonshot (platform.kimi.ai, base api.moonshot.ai/v1) ----
  # General-purpose default. Teammates send "model": "kimi-k2".
  - model_name: kimi-k2
    litellm_params:
      model: moonshot/kimi-k2.6
      api_key: os.environ/MOONSHOT_API_KEY
      api_base: os.environ/MOONSHOT_API_BASE
  # Cheaper / cost-sensitive workflows.
  - model_name: kimi-k2.5
    litellm_params:
      model: moonshot/kimi-k2.5
      api_key: os.environ/MOONSHOT_API_KEY
      api_base: os.environ/MOONSHOT_API_BASE
  # Strongest coding model (thinking always on). Moonshot does NOT return per-call cost,
  # so Kimi spend is price-map-only — and this model is too new for the map (tracks $0).
  # Hence the explicit pin (platform.kimi.ai: $0.95 / 1M in, $0.19 / 1M cache hit,
  # $4.00 / 1M out). The cache-hit pin matters: Moonshot auto-caches context, and without
  # it every cached token is metered at the full input price (~5x overcount on agentic
  # workloads). Remove once LiteLLM's cost map includes it.
  - model_name: kimi-k2.7-code
    litellm_params:
      model: moonshot/kimi-k2.7-code
      api_key: os.environ/MOONSHOT_API_KEY
      api_base: os.environ/MOONSHOT_API_BASE
      input_cost_per_token: 0.00000095
      output_cost_per_token: 0.000004
      cache_read_input_token_cost: 0.00000019
  # Flagship reasoning model (1M context, vision). Same deal: no per-call cost from
  # Moonshot and too new for the price map, so prices are pinned explicitly
  # (platform.kimi.ai/docs/pricing/chat-k3: $3.00 / 1M in, $0.30 / 1M cache hit,
  # $15.00 / 1M out). Remove the pins once the map includes moonshot/kimi-k3.
  - model_name: kimi-k3
    litellm_params:
      model: moonshot/kimi-k3
      api_key: os.environ/MOONSHOT_API_KEY
      api_base: os.environ/MOONSHOT_API_BASE
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      cache_read_input_token_cost: 0.0000003

  # ---- OpenRouter (base openrouter.ai/api/v1) ----
  # OpenRouter returns the actual per-call cost and LiteLLM records it directly. Pins
  # <= v1.93 dropped that inline cost on STREAMING responses (BerriAI/litellm#16021)
  # and fell back to the price map, so map-missing models metered $0 when streamed —
  # hence the temporary alias pins below at OpenRouter list prices (2026-07-23/24).
  # docker-compose.yml now pins v1.95.0, which contains the upstream fix (PR #32255,
  # stable since v1.94.0): after deploying, run the streaming spot-check in RUNBOOK
  # § "Pricing model", and once it passes REMOVE the alias pins below so the real
  # per-call cost wins again. Models the map covers (claude-sonnet, gemini-pro,
  # deepseek, deepseek-r1) are pin-free already. The map itself is auto-fetched from
  # GitHub at startup and refreshed by the nightly cron (POST /reload/model_cost_map).
  - model_name: claude-sonnet
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4.6
      api_key: os.environ/OPENROUTER_API_KEY
  # Missing from the price map — pinned so streamed calls don't meter $0.
  - model_name: claude-opus
    litellm_params:
      model: openrouter/anthropic/claude-opus-4.8
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.000025
      cache_read_input_token_cost: 0.0000005
      cache_creation_input_token_cost: 0.00000625
  # Missing from the price map — pinned so streamed calls don't meter $0.
  - model_name: gpt-5
    litellm_params:
      model: openrouter/openai/gpt-5.5
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.00003
      cache_read_input_token_cost: 0.0000005
  # Missing from the price map — pinned so streamed calls don't meter $0.
  - model_name: gpt-5-mini
    litellm_params:
      model: openrouter/openai/gpt-5.4-mini
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.00000075
      output_cost_per_token: 0.0000045
      cache_read_input_token_cost: 0.000000075
  - model_name: gemini-pro
    litellm_params:
      model: openrouter/google/gemini-2.5-pro
      api_key: os.environ/OPENROUTER_API_KEY
  # Missing from the price map — pinned so streamed calls don't meter $0.
  - model_name: gemini-flash
    litellm_params:
      model: openrouter/google/gemini-3.5-flash
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.0000015
      output_cost_per_token: 0.000009
      cache_read_input_token_cost: 0.00000015
  - model_name: deepseek
    litellm_params:
      model: openrouter/deepseek/deepseek-v3.2
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: deepseek-r1
    litellm_params:
      model: openrouter/deepseek/deepseek-r1
      api_key: os.environ/OPENROUTER_API_KEY
  # Missing from the price map — pinned so streamed calls don't meter $0
  # (openrouter.ai list prices, 2026-07-24: $0.435 / 1M in, $0.87 / 1M out).
  - model_name: deepseek-v4-pro
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.000000435
      output_cost_per_token: 0.00000087
      cache_read_input_token_cost: 0.000000003625
  # Missing from the price map — pinned so streamed calls don't meter $0
  # (openrouter.ai list prices, 2026-07-24: $0.30 / 1M in, $1.20 / 1M out).
  - model_name: minimax-m3
    litellm_params:
      model: openrouter/minimax/minimax-m3
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000012
      cache_read_input_token_cost: 0.00000006
  # Missing from the price map — pinned so streamed calls don't meter $0.
  - model_name: llama-4-maverick
    litellm_params:
      model: openrouter/meta-llama/llama-4-maverick
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.0000002
      output_cost_per_token: 0.0000008

  # Wildcard catch-all: any other OpenRouter model by its full ID, e.g.
  #   "model": "openrouter/qwen/qwen3-max".
  - model_name: openrouter/*
    litellm_params:
      model: openrouter/*
      api_key: os.environ/OPENROUTER_API_KEY

  # ---- Self-hosted vLLM (Runpod GPU pod, via reverse SSH tunnel) ----
  # DeepSeek-V4-Flash served by our own vLLM pod (github.com/paritytech/vllm-parity).
  # The pod has no stable public address (new IP every relaunch), so it dials INTO
  # this box over SSH (restricted "vllm-tunnel" account) and binds
  # 172.17.0.1:18000 -> its local vLLM :9001. host.docker.internal below resolves to
  # that same 172.17.0.1 (extra_hosts in docker-compose.yml), so pod restarts need no
  # change here — the pod just re-dials. Topology + box setup + rollout: RUNBOOK § I.
  # Prompts sent to this alias never leave Parity infrastructure (unless the
  # OpenRouter fallback below fires — see litellm_settings).
  # Cost pin: self-hosted means no per-call provider cost arrives, so unpinned calls
  # would meter $0 and dollar budgets would stop throttling exactly when tokens look
  # "free". Pinned at what OpenRouter actually billed us for this model (least-squares
  # over 759 logged calls, 2026-08-05..09: $0.118/1M in, $0.358/1M out), rounded UP so
  # budgets over- rather than under-throttle. A throttle proxy, not a real cost.
  - model_name: deepseek-flash
    litellm_params:
      # Served model name: `curl 127.0.0.1:9001/v1/models` on the pod. Keep the
      # hosted_vllm/ prefix — it routes via LiteLLM's OpenAI-compatible vLLM provider.
      model: hosted_vllm/REPLACE_WITH_SERVED_MODEL_NAME
      api_base: http://host.docker.internal:18000/v1
      api_key: os.environ/VLLM_API_KEY
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000004
      # Pod benchmark (1x B300, 2026-08-08): throughput holds up to ~32 parallel
      # requests. Cap below that knee; excess spills to the fallback instead of
      # queueing on a saturated GPU.
      max_parallel_requests: 24

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Models are defined here in config, not stored in the DB.
  store_model_in_db: false

  # ---- Request logging (training corpus) ----
  # Store full prompts + responses in the LiteLLM_SpendLogs table (Postgres), viewable
  # per-request in the /ui Logs page. Purpose: build a corpus for model training.
  # Teammates are informed (README "Logging & privacy") and can opt out per request by
  # sending "no-log": true in the body.
  store_prompts_in_spend_logs: true
  # Auto-delete spend-log rows older than 90 days, checked once a day. This bounds
  # Postgres growth only — nothing is lost: the durable corpus is the nightly JSONL
  # export (scripts/export-logs.sh), which runs long before rows age out. To keep
  # more/less in the hot store (UI browsing window), edit the period here and
  # force-recreate litellm.
  maximum_spend_logs_retention_period: "90d"
  maximum_spend_logs_retention_interval: "1d"

litellm_settings:
  # Silently drop unsupported OpenAI params instead of erroring (eases tool compatibility).
  drop_params: true
  # Self-hosted resilience: if the vLLM pod is unreachable (pod stopped, tunnel down)
  # or over its parallel cap, retry the SAME model on OpenRouter (served via the
  # openrouter/* wildcard above) — users get a slower, paid answer instead of an
  # error, and pod restarts stay invisible. Note: fallback traffic DOES leave our
  # infra (normal OpenRouter path). Verify both directions in RUNBOOK § I step 5.
  fallbacks:
    - deepseek-flash: ["openrouter/deepseek/deepseek-v4-flash-0731"]
