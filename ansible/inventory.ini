#
# One host. `ansible_host` is set to the box's IP rather than its name on purpose:
# phase 02 is meant to be runnable BEFORE the ai.labs.paritytech.io record exists,
# and connecting by name would make that impossible. Once DNS is live the IP still
# works, so there is nothing to change afterwards.

[llm_proxy]
# ansible_user is the ADMIN account, not root: 00-bootstrap.yml overrides it to
# root for that one play, and every phase afterwards connects as this user.
box ansible_host=51.159.116.128 ansible_user=llmops
