#
# Run every playbook from inside this directory so these defaults apply.

[defaults]
inventory = inventory.ini
roles_path = roles
# Readable multi-line output instead of one long line per result — matters most
# for --diff on templates. This used to be `stdout_callback = yaml`, a plugin
# that community.general removed in 12.0.0; the built-in default callback now
# does the same thing through this option.
callback_result_format = yaml
# Deprecation noise from collections we don't control is not actionable here.
deprecation_warnings = False
# The box's host key is pinned in the operator's known_hosts. Leaving this on
# means a rebuilt box (new host key) fails loudly instead of being trusted blind.
host_key_checking = True
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
